<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Audio Workstation & Sequencer</title>
  <style>
    /* =========================================================
       1. GLOBAL RESET & TOUCH OPTIMIERUNG
       ========================================================= */
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121214;
      color: #e4e4e7;
      touch-action: manipulation;
    }

    h1, h3 {
      margin: 0 0 12px 0;
      font-weight: 600;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: #1c1c21;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px;
    }

    /* =========================================================
       2. CONTROLS BAR
       ========================================================= */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 120px;
    }

    label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a1a1aa;
    }

    button {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s ease;
    }

    button:active {
      background: #1d4ed8;
    }

    button.active {
      background: #059669;
    }

    input[type="range"] {
      accent-color: #2563eb;
      width: 100%;
    }

    /* =========================================================
       3. PADS / HEX GRID
       ========================================================= */
    .held-notes-display {
      font-size: 13px;
      color: #f59e0b;
      margin-bottom: 12px;
    }

    .pad-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      gap: 8px;
    }

    .pad {
      height: 60px;
      background: #27272a;
      border: 2px solid #3f3f46;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      touch-action: none;
      transition: background 0.05s, transform 0.05s, border-color 0.05s;
    }

    .pad.active {
      background: #2563eb;
      border-color: #60a5fa;
      transform: scale(0.95);
    }

    .pad.held {
      border-color: #f59e0b;
      background: #78350f;
    }

    /* =========================================================
       4. TRACK SEQUENCER (FIX FÜR LAYOUT-VERSCHIEBUNG)
       ========================================================= */
    .track-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .track {
      background: #121214;
      border: 1px solid #27272a;
      padding: 12px;
      border-radius: 8px;
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: #a1a1aa;
    }

    .step-grid-wrapper {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .step-grid {
      display: grid;
      grid-template-columns: repeat(16, minmax(32px, 1fr));
      gap: 4px;
    }

    .step {
      aspect-ratio: 1;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      cursor: pointer;
      touch-action: none;
    }

    .step.active {
      background: #059669;
      border-color: #34d399;
    }

    .step.current {
      border-color: #ffffff;
      box-shadow: inset 0 0 0 2px #ffffff;
    }

    .step.active.current {
      background: #10b981;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Sequencer & Sound Workstation</h1>

  <!-- GLOBAL CONTROLS -->
  <div class="panel controls-row">
    <button id="btnPlay">Start / Stop</button>
    
    <div class="control-group">
      <label for="bpm">BPM (<span id="bpmVal">120</span>)</label>
      <input type="range" id="bpm" min="60" max="200" value="120">
    </div>

    <div class="control-group">
      <label for="gate">Notenlänge / Gate (<span id="gateVal">80</span>%)</label>
      <input type="range" id="gate" min="10" max="200" value="80">
    </div>

    <button id="btnHold">Hold: OFF</button>
    <button id="btnArp">Arp: OFF</button>
  </div>

  <!-- PADS / HEX GRID -->
  <div class="panel">
    <h3>Pads (Max 4 Hold-Noten)</h3>
    <div class="held-notes-display">Gehaltene Noten: <span id="heldNotesText">keine</span></div>
    <div class="pad-grid" id="padGrid"></div>
  </div>

  <!-- MULTI-TRACK SEQUENCER -->
  <div class="panel">
    <h3>Multi-Track Sequencer</h3>
    <div class="track-container" id="trackContainer"></div>
  </div>
</div>

<script>
  /* =========================================================
     1. AUDIO CONTEXT & SYNTH ENGINE
     ========================================================= */
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  const noteFreqs = {
    'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
    'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
    'C5': 523.25
  };

  const noteNames = Object.keys(noteFreqs);

  function playSynthNote(freq, durationSec = 0.2) {
    if (!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durationSec);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + durationSec);
  }

  /* =========================================================
     2. HOLD LOGIK (MAX 4 NOTEN - FIFO)
     ========================================================= */
  let isHoldEnabled = false;
  let isArpEnabled = false;
  let heldNotes = [];
  const MAX_HELD_NOTES = 4;

  const btnHold = document.getElementById('btnHold');
  const btnArp = document.getElementById('btnArp');
  const heldNotesText = document.getElementById('heldNotesText');

  btnHold.addEventListener('click', () => {
    isHoldEnabled = !isHoldEnabled;
    btnHold.classList.toggle('active', isHoldEnabled);
    btnHold.innerText = `Hold: ${isHoldEnabled ? 'ON' : 'OFF'}`;
    if (!isHoldEnabled) {
      heldNotes = [];
      updateHeldDisplay();
    }
  });

  btnArp.addEventListener('click', () => {
    isArpEnabled = !isArpEnabled;
    btnArp.classList.toggle('active', isArpEnabled);
    btnArp.innerText = `Arp: ${isArpEnabled ? 'ON' : 'OFF'}`;
  });

  function handleNoteTrigger(note) {
    initAudio();

    if (isHoldEnabled) {
      if (heldNotes.includes(note)) {
        playCurrentNote(note);
        return;
      }

      if (heldNotes.length >= MAX_HELD_NOTES) {
        heldNotes.shift(); // Älteste Note fliegt raus
      }

      heldNotes.push(note);
      updateHeldDisplay();
    }

    if (!isArpEnabled) {
      playCurrentNote(note);
    }
  }

  function playCurrentNote(note) {
    const stepDurationSec = (60 / bpm) / 4;
    const duration = stepDurationSec * (gatePercent / 100);
    playSynthNote(noteFreqs[note], duration);
  }

  function updateHeldDisplay() {
    heldNotesText.innerText = heldNotes.length > 0 ? heldNotes.join(', ') : 'keine';
    
    document.querySelectorAll('.pad').forEach(pad => {
      const note = pad.dataset.note;
      pad.classList.toggle('held', heldNotes.includes(note));
    });
  }

  /* =========================================================
     3. PAD GRID GENERIERUNG
     ========================================================= */
  const padGrid = document.getElementById('padGrid');

  noteNames.forEach(note => {
    const pad = document.createElement('div');
    pad.className = 'pad';
    pad.innerText = note;
    pad.dataset.note = note;

    pad.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      pad.classList.add('active');
      handleNoteTrigger(note);
    });

    pad.addEventListener('pointerup', (e) => {
      e.preventDefault();
      pad.classList.remove('active');
    });

    pad.addEventListener('pointerleave', () => {
      pad.classList.remove('active');
    });

    padGrid.appendChild(pad);
  });

  /* =========================================================
     4. SEQUENCER & MULTI-TRACK LOGIK (POLY-RHYTHM FIX)
     ========================================================= */
  let isPlaying = false;
  let bpm = 120;
  let gatePercent = 80;
  let globalStep = 0;
  let timerId = null;
  let arpIndex = 0;

  const tracks = [
    { id: 1, name: 'Track 1 (64 Steps)', length: 64, steps: new Array(64).fill(false), note: 'C3' },
    { id: 2, name: 'Track 2 (16 Steps)', length: 16, steps: new Array(16).fill(false), note: 'E3' },
    { id: 3, name: 'Track 3 (16 Steps)', length: 16, steps: new Array(16).fill(false), note: 'G3' },
    { id: 4, name: 'Track 4 (16 Steps)', length: 16, steps: new Array(16).fill(false), note: 'C4' },
  ];

  // Standard-Patterns
  tracks[0].steps[0] = true; tracks[0].steps[16] = true; tracks[0].steps[32] = true; tracks[0].steps[48] = true;
  tracks[1].steps[4] = true; tracks[1].steps[12] = true;
  tracks[2].steps[8] = true;

  const btnPlay = document.getElementById('btnPlay');
  const bpmInput = document.getElementById('bpm');
  const bpmVal = document.getElementById('bpmVal');
  const gateInput = document.getElementById('gate');
  const gateVal = document.getElementById('gateVal');

  bpmInput.addEventListener('input', (e) => {
    bpm = parseInt(e.target.value);
    bpmVal.innerText = bpm;
    if (isPlaying) restartTimer();
  });

  gateInput.addEventListener('input', (e) => {
    gatePercent = parseInt(e.target.value);
    gateVal.innerText = gatePercent;
  });

  btnPlay.addEventListener('click', () => {
    initAudio();
    isPlaying = !isPlaying;
    btnPlay.classList.toggle('active', isPlaying);

    if (isPlaying) {
      globalStep = 0;
      arpIndex = 0;
      runSequencer();
    } else {
      clearTimeout(timerId);
      clearCurrentStepHighlights();
    }
  });

  function runSequencer() {
    const stepDurationMs = (60000 / bpm) / 4;
    const soundDurationSec = (stepDurationMs / 1000) * (gatePercent / 100);

    tracks.forEach(track => {
      // Modulo-Berechnung pro Track verhindert Hängenbleiben bei Step 49–64
      const trackStep = globalStep % track.length;

      updateTrackStepUI(track.id, trackStep);

      if (track.steps[trackStep]) {
        playSynthNote(noteFreqs[track.note], soundDurationSec);
      }
    });

    if (isArpEnabled && heldNotes.length > 0) {
      const currentArpNote = heldNotes[arpIndex % heldNotes.length];
      playSynthNote(noteFreqs[currentArpNote], soundDurationSec);
      arpIndex++;
    }

    globalStep++;
    timerId = setTimeout(runSequencer, stepDurationMs);
  }

  function restartTimer() {
    clearTimeout(timerId);
    runSequencer();
  }

  /* =========================================================
     5. SEQUENCER UI BUILDER
     ========================================================= */
  const trackContainer = document.getElementById('trackContainer');

  function buildTrackUI() {
    trackContainer.innerHTML = '';

    tracks.forEach(track => {
      const trackEl = document.createElement('div');
      trackEl.className = 'track';

      const header = document.createElement('div');
      header.className = 'track-header';
      header.innerHTML = `<span><strong>${track.name}</strong></span> <span>Note: ${track.note}</span>`;

      const wrapper = document.createElement('div');
      wrapper.className = 'step-grid-wrapper';

      const stepGrid = document.createElement('div');
      stepGrid.className = 'step-grid';
      stepGrid.id = `track-grid-${track.id}`;

      // Rendere 16 sichtbare Steps im Grid
      for (let i = 0; i < 16; i++) {
        const step = document.createElement('div');
        step.className = 'step';
        step.dataset.stepIndex = i;

        if (track.steps[i]) {
          step.classList.add('active');
        }

        step.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const pageOffset = track.length > 16 ? Math.floor((globalStep % track.length) / 16) * 16 : 0;
          const targetStep = i + pageOffset;

          track.steps[targetStep] = !track.steps[targetStep];
          step.classList.toggle('active', track.steps[targetStep]);
        });

        stepGrid.appendChild(step);
      }

      wrapper.appendChild(stepGrid);
      trackEl.appendChild(header);
      trackEl.appendChild(wrapper);
      trackContainer.appendChild(trackEl);
    });
  }

  function updateTrackStepUI(trackId, trackStep) {
    const grid = document.getElementById(`track-grid-${trackId}`);
    if (!grid) return;

    const steps = grid.querySelectorAll('.step');
    const displayStep = trackStep % 16;

    steps.forEach((step, idx) => {
      step.classList.toggle('current', idx === displayStep);
    });
  }

  function clearCurrentStepHighlights() {
    document.querySelectorAll('.step').forEach(step => step.classList.remove('current'));
  }

  buildTrackUI();
</script>

</body>
</html>
